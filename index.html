<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bilete Universitatea Craiova – Stadionul Ion Oblemenco 3D</title>
    <meta name="description" content="Alege-ți locul pe harta 3D a Stadionului „Ion Oblemenco”: tribună, sector, rând și loc, cu vederea din scaun." />
    <meta name="theme-color" content="#0a1f44" />
    <link rel="icon" href="/brand/ucv-crest-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/ucv-crest-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Inter+Tight:wght@500..800&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Harta 3D a stadionului"></canvas>
      <div id="labels" class="labels" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand">
          <img class="crest-img" src="/brand/ucv-crest-180.png" alt="" width="30" height="38" />
          <div>
            <div class="brand-name">Universitatea Craiova</div>
            <div class="brand-sub">Prototip · harta 3D a stadionului</div>
          </div>
        </div>
        <div class="match" id="match"></div>
        <div class="account" id="account"></div>
      </header>

      <nav id="crumbs" class="crumbs" aria-label="Pași"></nav>

      <aside id="panel" class="panel" aria-live="polite"></aside>

      <div class="credits">Imagini satelit: Esri, Maxar, Earthstar Geographics · Hartă: © OpenStreetMap contributors</div>
      <div id="tip" class="tip" role="tooltip"></div>
      <section id="ticket" class="ticket" aria-live="polite"></section>
      <div id="legend" class="legend"></div>
      <div id="hint" class="hint"></div>
      <div id="modal" class="modal" role="dialog" aria-modal="true"></div>

      <div id="loader" class="loader">
        <div class="loader-card">
          <img class="crest-img big" src="/brand/ucv-crest.png" alt="Universitatea Craiova" width="84" height="106" />
          <div class="loader-title">Stadionul „Ion Oblemenco”</div>
          <div class="loader-sub" id="loader-sub">Se construiesc cele 30.702 de locuri…</div>
          <div class="loader-bar"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
